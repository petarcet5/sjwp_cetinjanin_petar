<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>forms</title>
  </head>
  <body>
    <h1>Student registration form</h1>
    <label for="number">Roll no.</label>
    <input type="number" name="number" id="number" /><br />
    <label for="name">Student name</label>
    <input type="text" name="name" id="name" /><br />
    <label for="fname">Fathers name</label>
    <input type="text" name="fname" id="fname" /><br />
    <label for="date">Date of birth</label>
    <input type="date" name="date" id="date" /><br />
    <label for="tel">Mobile number</label>
    <input type="tel" name="tel" id="tel" /><br />
    <label for="mail">Email id</label>
    <input type="email" name="mail" id="mail" /><br />
    <label for="pass">Password</label>
    <input type="password" name="pass" id="pass" /> <br />
    <p>Gender</p>
    <input type="radio" name="gender" id="male" />
    <label for="male">Male</label><br />
    <input type="radio" name="gender" id="female" />
    <label for="female">Female</label><br />
    <p>Department</p>
    <input type="checkbox" name="cse" id="cse" />
    <label for="cse">CSE</label><br />
    <input type="checkbox" name="it" id="it" />
    <label for="it">IT</label><br />
    <input type="checkbox" name="ete" id="ete" />
    <label for="ete">ETE</label><br />
    <input type="checkbox" name="civil" id="civil" />
    <label for="civil">Civil</label><br />
    <input type="checkbox" name="mech" id="mech" />
    <label for="mech">Mech</label><br />
  </body>
</html>
